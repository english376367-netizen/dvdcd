<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence Transformation – People and Hobbies</title>
<style>
:root{--blue:#1769aa;--green:#187744;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:#f2f6fa;color:#182635;font:16px/1.55 Arial,sans-serif;user-select:none;-webkit-user-select:none}
header{background:linear-gradient(120deg,#0e578e,#3188c7);color:white;text-align:center;padding:22px 14px}
h1{font-size:clamp(21px,4vw,30px);margin:0 0 6px}header p{margin:0}
main{max-width:950px;margin:20px auto;padding:0 12px}.panel{background:white;border-radius:14px;padding:18px;box-shadow:0 4px 16px #173b5814;margin-bottom:16px}
#gate{max-width:440px;margin:35px auto;text-align:center}input[type=password],textarea{width:100%;border:1px solid #b9c8d6;border-radius:9px;padding:12px;font:inherit;user-select:text;-webkit-user-select:text}
button{border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:white;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#607487}.hintbtn{background:#8654a6}.reset{background:#b54742}.check{background:#16804a}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar button{font-size:14px}
#questionNav{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
#questionNav button{background:#e3edf7;color:#194b72;padding:7px 11px}#questionNav button.current{background:var(--blue);color:white}#questionNav button.checked{background:#d9f2e3;color:#17653a}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#617386;font-size:14px}
.prompt{font-size:19px;font-weight:700;margin:14px 0 8px}.original{background:#f0f7ff;border-left:4px solid #3188c7;padding:12px;border-radius:8px;margin:12px 0}
.target{color:#4b5d6f;font-size:14px}.hintbox,.feedback{padding:12px;border-radius:9px;margin-top:12px;white-space:pre-wrap}.hintbox{background:#fff7d9;border-left:4px solid #e4b52e}.good{background:#e9f7ee;border-left:4px solid var(--green)}.bad{background:#fff0ef;border-left:4px solid var(--red)}
textarea{min-height:90px;resize:vertical}.score{font-weight:700;color:#104c7b}.note{font-size:13px;color:#607386}
@media(max-width:600px){.panel{padding:13px}.prompt{font-size:17px}.toolbar button{flex:1}}
</style>
</head>
<body>
<header><h1>Sentence Transformation Practice</h1><p>Topic: Appearance, hobbies and personality</p></header>
<main>
<section id="gate" class="panel">
<h2>Enter password</h2><p>Nhập mật khẩu để bắt đầu làm bài.</p>
<input id="pw" type="password" placeholder="Password" autocomplete="off">
<div style="margin-top:12px"><button onclick="unlock()">Start</button></div><p id="gateMsg" class="note"></p>
</section>
<div id="app" style="display:none">
<section class="panel">
<div class="meta"><span><b>Instructions:</b> Viết lại câu hoàn chỉnh. Mỗi câu chỉ được chấm một lần, trừ khi dùng Reset câu đó.</span><span class="score" id="score">Score: 0 / 10</span></div>
<div id="questionNav"></div>
</section>
<section class="panel" id="work"></section>
</div>
</main>
<script>
const qs=[
{src:"He has blonde hair and blue eyes.",lead:"His hair ...",answers:["his hair is blonde and his eyes are blue","his hair is blond and his eyes are blue"],display:"His hair is blonde and his eyes are blue.",hint:"Rewrite using “His hair is ... and his eyes are ...”.",grammar:"Đổi cấu trúc “He has blonde hair and blue eyes” thành hai mệnh đề với “His hair is … and his eyes are …”. “Blonde/blond” đều được dùng.",vi:"Anh ấy có mái tóc vàng hoe và đôi mắt xanh. → Tóc anh ấy màu vàng hoe và mắt anh ấy màu xanh."},
{src:"Lan’s hobbies are listening to music and reading comic books.",lead:"Lan likes ...",answers:["lan likes listening to music and reading comic books","lan likes listening to music and reading comics"],display:"Lan likes listening to music and reading comic books.",hint:"Use: like(s) + V-ing. Keep both activities parallel: listening ... and reading ...",grammar:"“Hobbies are + V-ing” có thể viết lại thành “likes + V-ing”. Khi liệt kê hai sở thích, dùng dạng song song: listening … and reading …",vi:"Sở thích của Lan là nghe nhạc và đọc truyện tranh. → Lan thích nghe nhạc và đọc truyện tranh."},
{src:"Brian is a close friend of mine.",lead:"Brian is one ...",answers:["brian is one of my close friends"],display:"Brian is one of my close friends.",hint:"Use: one of + possessive adjective + adjective + plural noun.",grammar:"Cấu trúc “a close friend of mine” có thể viết lại thành “one of my close friends”. Sau “one of” dùng danh từ số nhiều.",vi:"Brian là một người bạn thân của tôi. → Brian là một trong những người bạn thân của tôi."},
{src:"My best friend likes playing football after school.",lead:"My best friend is ...",answers:["my best friend is interested in playing football after school"],display:"My best friend is interested in playing football after school.",hint:"Use: be interested in + noun/V-ing.",grammar:"“Like doing something” có thể viết lại là “be interested in doing something”. Sau giới từ “in”, động từ thêm -ing.",vi:"Bạn thân nhất của tôi thích chơi bóng đá sau giờ học. → Bạn thân nhất của tôi hứng thú với việc chơi bóng đá sau giờ học."},
{src:"She does everything carefully.",lead:"She is ...",answers:["she is a careful person"],display:"She is a careful person.",hint:"Change the adverb “carefully” to the adjective “careful” + person.",grammar:"“Carefully” là trạng từ, đổi thành tính từ “careful” để bổ nghĩa cho danh từ “person”.",vi:"Cô ấy làm mọi việc một cách cẩn thận. → Cô ấy là người cẩn thận."},
{src:"Chi’s hair is long and black, and her nose is straight.",lead:"Chi has ...",answers:["chi has long black hair and a straight nose"],display:"Chi has long black hair and a straight nose.",hint:"Use: have/has + adjective + noun. Adjectives usually come before nouns.",grammar:"Gộp hai ý với “has”: “long black hair” (mái tóc dài đen) và “a straight nose” (một chiếc mũi thẳng). Trật tự tính từ: độ dài trước màu sắc.",vi:"Tóc của Chi dài và đen, mũi cô ấy thẳng. → Chi có mái tóc dài đen và chiếc mũi thẳng."},
{src:"Her hair is long and curly.",lead:"Her hair isn’t ...",answers:["her hair isn't short and straight","her hair is not short and straight"],display:"Her hair isn’t short and straight.",hint:"Use the opposite adjectives: long ↔ short; curly ↔ straight. Make the sentence negative.",grammar:"Đổi sang phủ định và dùng các tính từ trái nghĩa: long → short; curly → straight. “Isn’t” = “is not”.",vi:"Tóc cô ấy dài và xoăn. → Tóc cô ấy không ngắn và thẳng."},
{src:"His eyes are blue and big.",lead:"He has ...",answers:["he has blue and big eyes","he has big blue eyes"],display:"He has blue and big eyes. (More natural: He has big blue eyes.)",hint:"Use: He has + adjective(s) + eyes.",grammar:"Đổi “His eyes are …” thành “He has … eyes”. Cách diễn đạt tự nhiên hơn về trật tự tính từ là “big blue eyes”.",vi:"Mắt anh ấy xanh và to. → Anh ấy có đôi mắt xanh và to."},
{src:"Do you want to join our judo club?",lead:"Would you ...",answers:["would you like to join our judo club"],display:"Would you like to join our judo club?",hint:"Use: Would you like to + verb ...? for a polite invitation.",grammar:"“Do you want to …?” có thể viết lại thành “Would you like to …?” để hỏi/mời một cách lịch sự. Sau “would like” dùng “to + động từ nguyên mẫu”.",vi:"Bạn có muốn tham gia câu lạc bộ judo của chúng tôi không? → Bạn có muốn tham gia câu lạc bộ judo của chúng tôi không? (cách hỏi lịch sự hơn)"},
{src:"My friends are very honest.",lead:"I have ...",answers:["i have very honest friends"],display:"I have very honest friends.",hint:"Rewrite “My friends are ...” using “I have + adjective + plural noun”.",grammar:"Đổi “My friends are very honest” thành “I have very honest friends”. Tính từ “honest” đứng trước danh từ số nhiều “friends”.",vi:"Bạn bè của tôi rất trung thực. → Tôi có những người bạn rất trung thực."}
];
let current=0, answers=Array(qs.length).fill(''), checked=Array(qs.length).fill(false), hints=Array(qs.length).fill(false);
function unlock(){if(document.getElementById('pw').value==='367'){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';render()}else document.getElementById('gateMsg').textContent='Incorrect password. Try again.'}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
function render(){
 document.getElementById('questionNav').innerHTML=qs.map((q,i)=>`<button onclick="go(${i})" class="${i===current?'current ':''}${checked[i]?'checked':''}">${i+1}</button>`).join('');
 const q=qs[current];
 document.getElementById('work').innerHTML=`<div class="meta"><span>Question ${current+1} of ${qs.length}</span><span>${checked[current]?'Submitted — locked':'One attempt only'}</span></div>
 <div class="original"><div class="target">Original sentence</div><div class="prompt">${q.src}</div><div class="target">Rewrite beginning with:</div><div class="prompt">${q.lead}</div></div>
 <label for="answer"><b>Your answer</b></label><textarea id="answer" placeholder="Type the complete sentence here..." ${checked[current]?'disabled':''}>${esc(answers[current])}</textarea>
 <div class="toolbar" style="margin-top:12px"><button class="hintbtn" onclick="hint()" ${hints[current]||checked[current]?'disabled':''}>HINT</button><button class="check" onclick="check()" ${checked[current]?'disabled':''}>Check answer</button><button class="reset" onclick="resetOne()">Reset this question</button></div>
 <div>${hints[current]?`<div class="hintbox"><b>Hint:</b> ${q.hint}</div>`:''}</div>
 ${checked[current]?feedback(q,current):''}
 <div class="toolbar" style="margin-top:18px"><button class="secondary" onclick="prev()" ${current===0?'disabled':''}>Previous</button><button onclick="next()" ${current===qs.length-1?'disabled':''}>Next</button></div>
 <p class="note">Chọn số câu phía trên để chuyển trực tiếp. Reset chỉ xóa câu hiện tại và điểm của câu đó.</p>`;
 document.getElementById('score').textContent=`Score: ${getScore()} / ${qs.length}`;
 document.querySelectorAll('#questionNav button').forEach((b,i)=>{b.classList.toggle('current',i===current);b.classList.toggle('checked',checked[i])});
 const ta=document.getElementById('answer');if(ta&&!checked[current])ta.addEventListener('input',e=>answers[current]=e.target.value);
}
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function norm(x){return String(x).toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim()}
function feedback(q,i){let ok=q.answers.some(a=>norm(a)===norm(answers[i]));return `<div class="feedback ${ok?'good':'bad'}"><b>${ok?'✓ Correct!':'✗ Not quite. Compare with the model answer.'}</b><b>Đáp án mẫu:</b> ${esc(q.display)}<br><b>Giải thích cấu trúc:</b> ${esc(q.grammar)}<br><b>Nghĩa tiếng Việt:</b> ${esc(q.vi)}</div>`}
function check(){if(checked[current])return;let v=document.getElementById('answer').value.trim();if(!v){alert('Please type your answer first.');return}answers[current]=v;checked[current]=true;render()}
function hint(){hints[current]=true;render()}
function go(i){current=i;render()}
function next(){if(current<qs.length-1){current++;render()}}
function prev(){if(current>0){current--;render()}}
function resetOne(){answers[current]='';checked[current]=false;hints[current]=false;render()}
function getScore(){return checked.reduce((sum,v,i)=>sum+(v&&qs[i].answers.some(a=>norm(a)===norm(answers[i]))?1:0),0)}
document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('cut',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['c','x','a','s','u'].includes(e.key.toLowerCase()))e.preventDefault()});
</script>
</body>
</html>
